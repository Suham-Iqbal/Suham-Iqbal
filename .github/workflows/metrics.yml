name: Metrics Radar Graph
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Suham-Iqbal
          template: classic
          base: activity, community, repositories, metadata
          plugin_habits: yes
          plugin_habits_charts: yes
          config_timezone: Asia/Karachi
          config_theme: tokyonight
